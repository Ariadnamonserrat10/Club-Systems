<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Clubs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a2e;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 90%;
            max-width: 1100px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #2d3561 0%, #3f4e7a 50%, #5865a8 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow: hidden;
        }

        .geometric-shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(45deg);
            }

            50% {
                transform: translateY(-20px) rotate(45deg);
            }
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: -100px;
            left: -100px;
            border-radius: 30px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            bottom: -50px;
            right: -50px;
            transform: rotate(30deg);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            animation-delay: 1s;
        }

        .shape-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 10%;
            transform: rotate(60deg);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            animation-delay: 2s;
        }

        .left-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
        }

        .left-content h1 {
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .left-content p {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-create {
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            text-decoration: none;
            display: inline-block;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .btn-create:hover {
            background: white;
            color: #2d3561;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.3);
        }

        .right-panel {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #f8f9fa;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #4a5f8f 0%, #5865a8 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(74, 95, 143, 0.3);
            transition: all 0.3s;
        }

        .logo-icon:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .logo-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        .logo-section h2 {
            color: #2d3561;
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .user-type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .type-btn {
            flex: 1;
            padding: 12px 20px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            color: #666;
            font-weight: 600;
            font-size: 1em;
        }

        .type-btn:hover {
            border-color: #4a5f8f;
            color: #4a5f8f;
            transform: translateY(-2px);
        }

        .type-btn.active {
            background: linear-gradient(135deg, #4a5f8f 0%, #5865a8 100%);
            color: white;
            border-color: #4a5f8f;
            box-shadow: 0 4px 15px rgba(74, 95, 143, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .input-container {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #4a5f8f;
            transition: all 0.3s;
        }

        .form-group input:focus+.input-icon {
            fill: #2d3561;
            transform: translateY(-50%) scale(1.1);
        }

        .form-group input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a5f8f;
            box-shadow: 0 0 0 3px rgba(74, 95, 143, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 25px;
        }

        .forgot-password a {
            color: #4a5f8f;
            text-decoration: none;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        .forgot-password a:hover {
            color: #2d3561;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4a5f8f 0%, #5865a8 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(74, 95, 143, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 95, 143, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f5c6cb;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c3e6cb;
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                width: 95%;
            }

            .left-panel {
                padding: 40px 20px;
                min-height: 300px;
            }

            .left-content h1 {
                font-size: 2em;
            }

            .right-panel {
                padding: 40px 30px;
            }

            .user-type-selector {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="geometric-shape shape-1"></div>
            <div class="geometric-shape shape-2"></div>
            <div class="geometric-shape shape-3"></div>

            <div class="left-content">
                <h1>Inicio</h1>
                <p>Sistema de Gestión<br>de Clubs Estudiantiles</p>
                <a href="CrearCuenta.html" class="btn-create">Crear Cuenta</a>
            </div>
        </div>

        <div class="right-panel">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        <circle cx="18" cy="8" r="2" />
                        <circle cx="6" cy="8" r="2" />
                    </svg>
                </div>
                <h2>Inicio</h2>
            </div>

            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="user-type-selector">
                    <button type="button" class="type-btn active" onclick="selectUserType('oficina', event)">
                        Oficina
                    </button>
                    <button type="button" class="type-btn" onclick="selectUserType('monitor', event)">
                        Monitor
                    </button>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <input type="text" id="usuario" placeholder="Usuario" required>
                        <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-container">
                        <input type="password" id="password" placeholder="Contraseña" required>
                        <svg class="input-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                        </svg>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#"
                        onclick="showMessage('error', 'Contacta al administrador para recuperar tu contraseña'); return false;">¿Olvidó
                        su contraseña?</a>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </div>

    <script>
        let selectedUserType = 'oficina';

        function selectUserType(type, event) {
            event.preventDefault();
            selectedUserType = type;

            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function showMessage(type, message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (type === 'error') {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            } else {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
            }

            setTimeout(() => {
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
            }, 5000);
        }
//Función del login
        function handleLogin(event) {
            event.preventDefault();

            const usuario = document.getElementById('usuario').value;
            const password = document.getElementById('password').value;

            fetch('../Backend/login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `usuario=${encodeURIComponent(usuario)}&password=${encodeURIComponent(password)}&tipo_usuario=${encodeURIComponent(selectedUserType)}`
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        window.location.href = data.redirect;
                    } else {
                        showMessage('error', data.message);
                    }
                })
                .catch(err => showMessage('error', 'Error de conexión al servidor'));
        }

    </script>
</body>

</html>
